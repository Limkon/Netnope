<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 - 网络福利资源分享网站</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- 顶部统一高密度科技导航栏 -->
    <header>
        <div class="navbar-inner">
            <h1>
                <a href="/">
                    <span style="font-size: 1.6rem; filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.6));">⚡</span>
                    网络福利资源分享
                </a>
            </h1>
            <nav id="mainNav">
                <!-- 由 main.js 动态挂载统一导航与用户状态 -->
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="form-container">
            <h2>
                <span>🔐 修改您的登录密码</span>
                <span style="font-size: 0.85rem; font-weight: normal; color: var(--text-muted); margin-left: auto;">
                    账号: <strong id="usernameDisplay" style="color: var(--cyber-blue);">{{username}}</strong>
                </span>
            </h2>

            <div id="changePasswordMessage"></div>

            <form id="changeOwnPasswordForm" class="form-styled">
                <div>
                    <label for="currentPassword">当前旧密码 <span style="color: var(--cyber-pink);">*</span>:</label>
                    <input 
                        type="password" 
                        id="currentPassword" 
                        name="currentPassword" 
                        placeholder="输入您正在使用的当前密码" 
                        required
                    >
                </div>
                
                <div>
                    <label for="newPasswordUser">新安全密码 <span style="color: var(--cyber-pink);">*</span>:</label>
                    <input 
                        type="password" 
                        id="newPasswordUser" 
                        name="newPassword" 
                        placeholder="输入新密码 (管理员/咨询师不能为空)" 
                        required
                    >
                </div>

                <div>
                    <label for="confirmNewPasswordUser">确认新密码 <span style="color: var(--cyber-pink);">*</span>:</label>
                    <input 
                        type="password" 
                        id="confirmNewPasswordUser" 
                        name="confirmNewPassword" 
                        placeholder="请再次输入新密码核对" 
                        required
                    >
                </div>

                <div class="form-actions" style="margin-top: 25px;">
                    <button type="submit" id="submitChangePassword" class="button-action">确认修改密码</button>
                    <a href="/management" class="button-action button-cancel">返回管理中枢</a>
                </div>
            </form>
        </div>
    </div>

    <!-- 全局页脚 -->
    <footer>
        <p id="copyrightFooter">&copy; 2025 网络福利资源分享网站。</p>
    </footer>

    <script src="/js/main.js"></script>
    <script>
        // 页面独有及传递给 main.js 的服务器鉴权参数
        const currentUsername = "{{username}}"; 
        const currentUsernameFromServer = "{{username}}"; 
        const currentUserRoleFromServer = "{{userRole}}";   
        const currentUserIdFromServer = "{{userId}}";
        
        document.addEventListener('DOMContentLoaded', () => {
            const usernameDisplayElem = document.getElementById('usernameDisplay');
            if (usernameDisplayElem) {
                usernameDisplayElem.textContent = currentUsername || '用户';
            }
        });
    </script>
</body>
</html>
