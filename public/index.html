<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - 网络福利资源分享网站</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- 顶部统一高密度科技导航栏 -->
    <header>
        <div class="navbar-inner">
            <h1>
                <a href="/">
                    <span style="font-size: 1.6rem; filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.6));">⚡</span>
                    网络福利资源分享
                </a>
            </h1>
            <nav id="mainNav">
                <!-- 由 main.js 动态挂载导航链接、管理入口与登录状态 -->
            </nav>
        </div>
    </header>

    <div class="container">
        <!-- 顶部搜索、分类与快捷操作工具栏 -->
        <div class="toolbar-actions" style="margin-bottom: 25px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
            <!-- 搜索表单 -->
            <form id="searchForm" style="display: flex; gap: 8px; flex-grow: 2; min-width: 260px;">
                <input 
                    type="search" 
                    id="searchInput" 
                    name="search" 
                    placeholder="输入关键字检索标题、正文或分类..." 
                    autocomplete="off"
                >
                <button type="submit" class="button-action" style="min-width: 80px;">搜索</button>
            </form>

            <!-- 分类筛选器 -->
            <div class="category-filter" style="flex-grow: 1; min-width: 140px;">
                <select id="categoryFilterSelect" title="按分类过滤文章">
                    <option value="all">所有分类</option>
                </select>
            </div>

            <!-- 清除搜索按钮 -->
            <button id="clearSearchButton" class="button-action button-cancel" style="min-width: 90px; display: none;">清除筛选</button>
        </div>

        <!-- 标题栏与信息提示区 -->
        <h2>
            <span>文章列表</span>
            <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-muted); margin-left: auto;">
                置顶文章优先显示
            </span>
        </h2> 
        
        <div id="globalMessageArea" style="margin-bottom: 15px;"></div>

        <!-- 文章列表挂载区域 -->
        <div id="articlesContainer">
            <p style="text-align: center; color: var(--cyber-cyan); padding: 30px;">正在加载文章...</p>
        </div>

        <!-- 分页挂载区域 -->
        <div id="paginationContainer"></div>
    </div>

    <!-- 全局页脚 -->
    <footer>
        <p id="copyrightFooter">&copy; 2025 网络福利资源分享网站。</p>
    </footer>

    <script src="/js/main.js"></script>
    <script>
        // 由服务器模板动态注入的用户鉴权参数
        const currentUsernameFromServer = "{{username}}";
        const currentUserRoleFromServer = "{{userRole}}";
        const currentUserIdFromServer = "{{userId}}";

        document.addEventListener('DOMContentLoaded', () => {
            // main.js 的 DOMContentLoaded 已接管导航构建、文章拉取及分页
        });
    </script>
</body>
</html>
