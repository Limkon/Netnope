<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理面板 - 网络福利资源分享网站</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .admin-section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .admin-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        .admin-card h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.15rem;
            color: var(--cyber-cyan);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <!-- 顶部统一高密度科技导航栏 -->
    <header>
        <div class="navbar-inner">
            <h1>
                <a href="/">
                    <span style="font-size: 1.6rem; filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.6));">⚡</span>
                    网络福利资源分享
                </a>
            </h1>
            <nav id="mainNav">
                <!-- 由 main.js 动态挂载管理员完整导航 -->
            </nav>
        </div>
    </header>

    <div class="container">
        <h2>
            <span>⚙️ 管理员核心控制台</span>
            <span style="font-size: 0.85rem; font-weight: normal; color: var(--text-muted); margin-left: auto;">
                管理员凭证: <strong id="adminUsernameDisplay" style="color: var(--cyber-blue);">{{adminUsername}}</strong>
            </span>
        </h2>
        
        <!-- 全局管理操作提示 -->
        <div id="adminMessages" style="margin-bottom: 20px;"></div>

        <!-- 上部：参数配置与用户添加网格 -->
        <div class="admin-section-grid">
            <!-- 站点全局设置 -->
            <div class="admin-card">
                <h3><span>🔧</span> <span>站点参数调优</span></h3>
                <form id="siteSettingsForm" class="form-styled">
                    <div>
                        <label for="articlesPerPage">首页每页呈现文章数 (1 - 100):</label>
                        <input 
                            type="number" 
                            id="articlesPerPage" 
                            name="articlesPerPage" 
                            value="{{articlesPerPage}}" 
                            min="1" 
                            max="100" 
                            required
                        >
                    </div>
                    <div class="form-actions" style="margin-top: 15px;">
                        <button type="submit" id="saveSettingsButton" class="button-action">保存参数设置</button>
                    </div>
                </form>
            </div>

            <!-- 新建系统用户 -->
            <div class="admin-card">
                <h3><span>➕</span> <span>快速新建用户</span></h3>
                <form id="addUserForm" class="form-styled">
                    <div>
                        <label for="newUsername">用户名 <span style="color: var(--cyber-pink);">*</span>:</label>
                        <input type="text" id="newUsername" name="username" placeholder="输入唯一样本用户名" required>
                    </div>
                    <div>
                        <label for="newPassword">初始密码:</label>
                        <input type="password" id="newPassword" name="password" placeholder="会员可为空，管理员/咨询师必填">
                    </div>
                    <div>
                        <label for="newRole">分配权限角色:</label>
                        <select id="newRole" name="role">
                            <option value="member" selected>会员 (member) - 浏览与评论</option>
                            <option value="consultant">咨询师 (consultant) - 创作与编辑</option>
                            <option value="admin">系统管理员 (admin) - 全局控制</option>
                        </select>
                    </div>
                    <div class="form-actions" style="margin-top: 15px;">
                        <button type="submit" class="button-action">确认创建用户</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 下部：现有用户集群管理列表 -->
        <div style="margin-top: 10px;">
            <h3 style="color: #fff; font-size: 1.25rem; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;">
                <span>👥</span>
                <span>现有系统用户集群</span>
            </h3>
            
            <ul id="userList" class="user-list">
                <li style="color: var(--text-muted); padding: 15px;">正在加载用户列表...</li>
            </ul>
        </div>
    </div>

    <!-- 全局页脚 -->
    <footer>
        <p id="copyrightFooter">&copy; 2025 网络福利资源分享网站。</p>
    </footer>

    <script src="/js/main.js"></script>
    <script>
        // 传递给 main.js 的管理员基础配置参数
        const currentAdminUsername = "{{adminUsername}}";
        const currentAdminId = "{{adminUserId}}";
        const initialArticlesPerPage = "{{articlesPerPage}}";

        const currentUsernameFromServer = "{{adminUsername}}";
        const currentUserRoleFromServer = "admin";
        const currentUserIdFromServer = "{{adminUserId}}";

        document.addEventListener('DOMContentLoaded', () => {
            const adminDisplay = document.getElementById('adminUsernameDisplay');
            if (adminDisplay) {
                adminDisplay.textContent = currentAdminUsername || 'Admin';
            }
            
            const articlesPerPageInput = document.getElementById('articlesPerPage');
            if (articlesPerPageInput) {
                articlesPerPageInput.value = initialArticlesPerPage || 10;
            }
        });
    </script>
</body>
</html>
