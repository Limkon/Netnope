<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>详细访问统计 - 网络福利资源分享网站</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .stats-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 22px;
            background: var(--bg-surface);
            display: flex;
            flex-direction: column;
            transition: all 0.25s ease;
        }
        .stats-card:hover {
            border-color: var(--cyber-blue);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 12px rgba(0, 210, 255, 0.15);
        }
        .stats-card h3 {
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            font-size: 1.15rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stats-card ul {
            padding: 0;
            list-style: none;
            max-height: 380px;
            overflow-y: auto;
            margin: 0;
        }
        .stats-card ul::-webkit-scrollbar {
            width: 5px;
        }
        .stats-card ul::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }
        .stats-card li {
            padding: 9px 4px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .stats-card li:last-child {
            border-bottom: none;
        }
        .stats-card li .count {
            font-weight: 600;
            color: var(--cyber-cyan);
            background: rgba(0, 210, 255, 0.12);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.82rem;
            border: 1px solid rgba(0, 210, 255, 0.25);
        }
        .stat-metric-group {
            margin-bottom: 18px;
        }
        .stat-metric-group:last-child {
            margin-bottom: 0;
        }
        .stat-metric-group p {
            margin: 0 0 4px 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .stats-card .stat-value {
             font-size: 2rem;
             font-weight: 700;
             color: var(--cyber-cyan);
             line-height: 1.2;
             background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
             -webkit-background-clip: text;
             -webkit-text-fill-color: transparent;
             letter-spacing: -0.5px;
        }
    </style>
</head>
<body>
    <!-- 顶部统一高密度科技导航栏 -->
    <header>
        <div class="navbar-inner">
            <h1>
                <a href="/">
                    <span style="font-size: 1.6rem; filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.6));">⚡</span>
                    网络福利资源分享
                </a>
            </h1>
            <nav id="mainNav">
                <!-- 由 main.js 挂载统一顶栏 -->
            </nav>
        </div>
    </header>

    <div class="container">
        <h2>
            <span>📊 高密实时流量与访问监控</span>
            <span style="font-size: 0.85rem; font-weight: normal; color: var(--text-muted); margin-left: auto;">
                日志引擎: JSONL 离散审计
            </span>
        </h2>
        
        <div id="statsMessageArea"></div>

        <!-- 统计指标网格大屏 -->
        <div class="stats-grid">
            <!-- 核心三指标看板 -->
            <div class="stats-card">
                <h3><span>📈</span> <span>流量概览基准</span></h3>
                
                <div class="stat-metric-group">
                    <p>总访问量 (内存缓存实时计数):</p>
                    <div class="stat-value" id="stats-total-views-cached">...</div>
                </div>

                <div class="stat-metric-group">
                    <p>外部入站会话总计 (日志落盘分析):</p>
                    <div class="stat-value" id="stats-total-views-log">...</div>
                </div>

                <div class="stat-metric-group">
                    <p>全域独立访客总量 (Unique IP 去重):</p>
                    <div class="stat-value" id="stats-unique-visitors">...</div>
                </div>
            </div>

            <!-- 按页面浏览排行 -->
            <div class="stats-card">
                <h3 id="stats-by-page-title"><span>📑</span> <span>热门资源与页面 (Top 15)</span></h3>
                <ul id="stats-by-page-list">
                    <li style="color: var(--text-muted);">正在加载实时排行...</li>
                </ul>
            </div>

            <!-- 按日期趋势统计 -->
            <div class="stats-card">
                <h3 id="stats-by-date-title"><span>📅</span> <span>近期访问热度 (最近 15 天)</span></h3>
                <ul id="stats-by-date-list">
                    <li style="color: var(--text-muted);">正在加载趋势数据...</li>
                </ul>
            </div>

            <!-- 按外部渠道来源统计 -->
            <div class="stats-card">
                <h3 id="stats-by-referrer-title"><span>🌐</span> <span>流量引流来源 (Top 15)</span></h3>
                <ul id="stats-by-referrer-list">
                    <li style="color: var(--text-muted);">正在加载来源分布...</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 全局页脚 -->
    <footer>
        <p id="copyrightFooter">&copy; 2025 网络福利资源分享网站。</p>
    </footer>

    <script src="/js/main.js"></script>
    <script>
        // 传递给 main.js 的服务器鉴权参数
        const currentUsernameFromServer = "{{username}}";
        const currentUserRoleFromServer = "{{userRole}}";
        const currentUserIdFromServer = "{{userId}}";
    </script>
</body>
</html>
