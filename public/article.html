<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{pageTitle}} - 网络福利资源分享网站</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* 置顶控制高光区域 */
        .pinned-control-card {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--pin-bg);
            border: 1px dashed var(--pin-border);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            height: 40px;
            box-sizing: border-box;
            align-self: flex-end;
            margin-bottom: 1.4rem;
        }
        .pinned-control-card label {
            margin-bottom: 0 !important;
            color: var(--pin-gold) !important;
            font-weight: 600 !important;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 顶部统一高密度科技导航栏 -->
    <header>
        <div class="navbar-inner">
            <h1>
                <a href="/">
                    <span style="font-size: 1.6rem; filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.6));">⚡</span>
                    网络福利资源分享
                </a>
            </h1>
            <nav id="mainNav">
                <!-- 由 main.js 动态挂载统一导航 -->
            </nav>
        </div>
    </header>

    <div class="container">
        <!-- 页面标题 -->
        <h2 id="pageTitleHeader">{{pageTitle}}</h2>
        
        <form id="articleForm" class="form-styled">
            <input type="hidden" id="articleId" name="articleId" value="{{articleId}}">
            
            <!-- 标题输入框 -->
            <div>
                <label for="title">文章标题 <span style="color: var(--cyber-pink); font-size: 0.9em;">*</span>:</label>
                <input type="text" id="title" name="title" placeholder="输入引人注目的文章标题..." required>
            </div>
            
            <!-- 属性聚合行：分类、发布状态、管理员置顶 -->
            <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-start;">
                <!-- 分类 -->
                <div style="flex-grow: 1; min-width: 220px;">
                    <label for="category">分类标签:</label>
                    <input type="text" id="category" name="category" placeholder="例如: 实用工具, 技术干货, 福利精选">
                </div>

                <!-- 状态 -->
                <div style="flex-grow: 1; min-width: 160px;">
                    <label for="status">保存状态:</label>
                    <select id="status" name="status">
                        <option value="draft">保存为草稿 (Draft)</option>
                        <option value="published" selected>立即公开发布 (Published)</option>
                    </select>
                </div>

                <!-- 管理员置顶复选框 -->
                {{#if isAdmin}}
                <div class="pinned-control-card" title="勾选后此文章将在首页置顶排在最前列">
                    <input type="checkbox" id="isPinned" name="isPinned" value="true">
                    <label for="isPinned" class="checkbox-label">★ 置顶这篇文章</label>
                </div>
                {{/if}}
            </div>

            <!-- 富文本编辑器区 -->
            <div>
                <label for="richContent">文章正文内容 <span style="color: var(--cyber-pink); font-size: 0.9em;">*</span>:</label>
                <div class="rich-text-editor-wrapper">
                    <!-- 工具栏 -->
                    <div id="richTextToolbar">
                        <button type="button" data-command="bold" title="加粗"><b>B</b></button>
                        <button type="button" data-command="italic" title="斜体"><i>I</i></button>
                        <button type="button" data-command="underline" title="下划线"><u>U</u></button>
                        <button type="button" data-command="insertUnorderedList" title="项目符号列表">无序列表</button>
                        <button type="button" data-command="insertOrderedList" title="编号列表">有序列表</button>
                        <button type="button" data-command="createLink" title="插入超链接">🔗 链接</button>
                        <button type="button" data-command="unlink" title="移除链接">解除链接</button>
                        
                        <select id="fontNameSelector" title="选择字体">
                            <option value="Arial">Arial</option>
                            <option value="Verdana">Verdana</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Courier New">Courier New</option>
                            <option value="Microsoft YaHei">微软雅黑</option>
                            <option value="SimSun">宋体</option>
                            <option value="KaiTi">楷体</option>
                        </select>

                        <select id="fontSizeSelector" title="字体大小">
                            <option value="1">极小</option>
                            <option value="2">小</option>
                            <option value="3" selected>正常</option>
                            <option value="4">稍大</option>
                            <option value="5">大</option>
                            <option value="6">极大</option>
                        </select>

                        <label for="foreColorPicker" class="sr-only">文字颜色</label>
                        <input type="color" id="foreColorPicker" title="文字颜色" value="#00f2fe">

                        <button type="button" id="insertLocalImageButton" title="插入本地图片">🖼️ 插图</button>
                        <input type="file" id="imageUploadInput" accept="image/*" style="display:none;">
                    </div>

                    <!-- 可编辑区域 -->
                    <div id="richContent" contenteditable="true" placeholder="在此输入富文本内容，支持直接粘贴剪贴板文字与图片..."></div>
                </div>
                <textarea name="content" id="hiddenContent" style="display:none;"></textarea>
            </div>

            <!-- 附件管理区 -->
            <div style="margin-top: 15px;">
                <label for="attachment">文件附件 (可选，支持文档、归档压缩包等):</label>
                <input type="file" id="attachment" name="attachment">
                <div id="currentAttachment" class="current-attachment-info"></div>
                <div id="removeAttachmentContainer" style="display:none; margin-top: 8px;">
                    <input type="checkbox" id="removeAttachmentCheckbox" name="removeAttachment" value="true">
                    <label for="removeAttachmentCheckbox" class="checkbox-label" style="color: var(--cyber-danger) !important;">
                        🗑️ 勾选以移除现有附件
                    </label>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="form-actions" style="margin-top: 25px;">
                <button type="submit" id="saveArticleButton" class="button-action" style="min-width: 120px;">保存文章</button>
                <a href="/" class="button-action button-cancel">取消并返回</a>
            </div>
        </form>

        <!-- 提示信息区域 -->
        <div id="formMessage" style="margin-top: 15px;"></div>
    </div>

    <!-- 全局页脚 -->
    <footer>
        <p id="copyrightFooter">&copy; 2025 网络福利资源分享网站。</p>
    </footer>

    <script src="/js/main.js"></script>
    <script>
        // 模板注入参数
        const currentUsernameFromServer = "{{username}}"; 
        const currentUserRoleFromServer = "{{userRole}}";   
        const currentUserIdFromServer = "{{userId}}";     
        const articleIdForEdit = "{{articleId}}";
        const pageTitleFromServer = "{{pageTitle}}";
        const isAdminUser = ("{{isAdmin}}" === "true"); 

        let pageTitle = pageTitleFromServer;
        if (pageTitleFromServer.includes("编辑")) {
            pageTitle = "编辑文章";
        } else if (pageTitleFromServer.includes("新增") || pageTitleFromServer.includes("新建") || pageTitleFromServer.includes("发表")) {
            pageTitle = "发表新文章";
        }

        document.addEventListener('DOMContentLoaded', () => {
            const pageTitleHeader = document.getElementById('pageTitleHeader');
            if (pageTitleHeader) pageTitleHeader.textContent = pageTitle;
            document.title = `${pageTitle} - 网络福利资源分享网站`;
        });
    </script>
</body>
</html>
